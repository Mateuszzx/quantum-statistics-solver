# ==============================================================================
# Codecov Configuration
# ==============================================================================
# This file configures code coverage reporting for Codecov.io
# Coverage data is generated by:
#   - C++: lcov/gcovr (see Makefile: coverage-cpp)
#   - Python: coverage.py/pytest-cov (see Makefile: coverage-python)
#
# Coverage reports are uploaded automatically in CI workflows:
#   - .github/workflows/ci.yml
#   - .github/workflows/windows.yml
#
# Upload manually: codecov -f build/coverage/coverage.xml
# ==============================================================================

# ------------------------------------------------------------------------------
# Coverage Status Checks
# ------------------------------------------------------------------------------
# These checks determine if a PR passes or fails based on coverage changes

coverage:
  status:
    # Overall project coverage
    project:
      default:
        target: 80%           # Aim for 80% total coverage
        threshold: 2%         # Allow 2% drop without failing

    # Coverage of changed code (PR diff)
    patch:
      default:
        target: 70%           # New code should be 70% covered
        threshold: 5%         # Allow 5% variance

# ------------------------------------------------------------------------------
# PR Comment Configuration
# ------------------------------------------------------------------------------
# Customize the coverage comment posted on pull requests

comment:
  layout: "header, diff, files, footer"
  behavior: default          # Update existing comment
  require_changes: false     # Always comment
  require_base: false        # Comment even without base comparison

# ------------------------------------------------------------------------------
# Ignore Patterns
# ------------------------------------------------------------------------------
# Exclude files/directories from coverage reporting

ignore:
  - "tests/**/*"             # Test files don't need coverage
  - "tools/**/*"             # Vendored scripts
  - "notebooks/**/*"         # Jupyter notebooks
  - "docs/**/*"              # Documentation
  - "**/__pycache__/**/*"    # Python cache
  - "**/external/**/*"       # Third-party code
  - "build/**/*"             # Build artifacts

# ------------------------------------------------------------------------------
# Flags for Multi-Language Coverage
# ------------------------------------------------------------------------------
# Separate C++ and Python coverage tracking (set in CI workflows)
#
# Example GitHub Actions usage:
#   - uses: codecov/codecov-action@v4
#     with:
#       files: build/coverage/coverage.xml
#       flags: python
#       name: Python Coverage
#
# View in Codecov dashboard to see:
#   - C++ coverage: flags=cpp
#   - Python coverage: flags=python
#   - Linux coverage: flags=linux
#   - Windows coverage: flags=windows
# ==============================================================================
