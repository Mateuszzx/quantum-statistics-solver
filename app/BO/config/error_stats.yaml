physics:
  H_a: 0.0
  dist_type: "FD"

ranges:
  n_start: 0.01
  n_end: 0.99
  n_steps: 10
  beta_start_exp: 0
  beta_end_exp: 3
  beta_steps: 10

solver:
  T0: 100.0
  alpha: 0.99
  step_decay: 0.99
  min_iters: 1000
  max_iters: 2000
  stall_iters: 500
  bounds: [[-10.0, 10.0]]
  step_sigma: 10.0
  T_min: 1.e-6
  sched: "Exponential"  # Options: Exponential, Linear, Logarithmic, Sawtooth
  scale_sigma_by_T: true
  reflect_bounds: true
  abs_tol: 1.e-12
  rel_tol: 1.e-9
  seed: null
